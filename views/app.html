<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Bandeja en vivo</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="logo small" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
        </svg>
      </span>
      <h1>Bandeja en vivo</h1>
    </div>
    <span id="status" class="status" data-state="wait">Conectando…</span>
    <form method="post" action="/logout">
      <button type="submit" class="ghost">Salir</button>
    </form>
  </header>

  <main class="feed">
    <div id="empty" class="empty">
      <div class="radar" aria-hidden="true">
        <span></span><span></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
        </svg>
      </div>
      <h2>Esperando correos nuevos…</h2>
      <p>Solo aparecen los que lleguen mientras esta página esté abierta.</p>
    </div>
    <ul id="messages" class="messages"></ul>
  </main>

  <template id="message-template">
    <li class="message is-new">
      <div class="avatar" aria-hidden="true"></div>
      <div class="head">
        <div class="meta">
          <strong class="subject"></strong>
          <span class="badge">Nuevo</span>
          <time class="time"></time>
        </div>
        <div class="from"><span class="from-name"></span> <span class="from-address"></span></div>
      </div>
      <div class="body"></div>
    </li>
  </template>
</body>
</html>
